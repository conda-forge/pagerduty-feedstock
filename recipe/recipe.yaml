schema_version: 1

context:
  name: pagerduty
  version: "7.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3c8e8bd0197edb10fdc4c6601ae487e262895de226ac87673a2a4292b71469b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pagerduty = pagerduty.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - httpx2

tests:
  - python:
      imports:
        - pagerduty
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pagerduty --help

about:
  summary: Clients for PagerDuty's Public APIs
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/PagerDuty/python-pagerduty
  repository: https://github.com/PagerDuty/python-pagerduty
  documentation: https://pagerduty.github.io/python-pagerduty/user_guide.html

extra:
  recipe-maintainers:
    - xylar
